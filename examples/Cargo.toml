[package]
name = "ataraxia-examples"
version = "0.0.0"
publish = false
authors = ["rndrmu"]
edition = "2021"

[dependencies]
dotenv = "0.13.0"
tracing-subscriber = "0.3.11"
serde_json = "1.0.67"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
dashmap = "5"
rand = "0.8"
tracing = "0.1"

[dependencies.ataraxia]
path = "../ataraxia"
features = ["voice"]

[dependencies.ataraxia-voice]
path = "../ataraxia-voice"

[dependencies.tokio]
version = "1"
default-features = true
features = ["fs", "macros", "rt-multi-thread", "io-util"]

[[example]]
name = "devbot"
path = "./basic_bot.rs"

[[example]]
name = "command_framework"
path = "./command_framework.rs"

[[example]]
name = "music_bot"
path = "./music_bot.rs"

[package]
name = "ataraxia-voice"
authors = ["rndrmu"]
version = "0.1.0"
edition = "2021"
description = "Voice support for the Ataraxia Revolt library (LiveKit/WebRTC)"
license = "BSD-3-Clause"

[build-dependencies]
cc = "1"

[dependencies]
tokio = { version = "1", features = ["full"] }
livekit = { git = "https://github.com/livekit/rust-sdks", branch = "main", features = ["rustls-tls-native-roots"] }

# Audio transcoding pipeline
opus = "0.3"
serde_json = "1"
